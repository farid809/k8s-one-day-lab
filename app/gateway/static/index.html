<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; color: #1a1a2e; }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: .5rem; margin: 1rem 0; }
  input { flex: 1; padding: .5rem; font-size: 1rem; }
  button { padding: .5rem .9rem; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: .6rem; padding: .45rem 0; border-bottom: 1px solid #eee; }
  li.done span.title { text-decoration: line-through; color: #999; }
  li span.title { flex: 1; cursor: pointer; }
  #served { color: #666; font-size: .85rem; margin-top: 1.5rem; }
  #served b { color: #0f6; background: #123; padding: .1rem .4rem; border-radius: 4px; }
</style>
</head>
<body>
<h1>Task Board</h1>
<form id="f"><input id="title" placeholder="New task…" required><button>Add</button></form>
<ul id="list"></ul>
<p id="served">served by: <b>–</b></p>
<script>
const list = document.getElementById('list');
const served = document.querySelector('#served b');

// The "served by" hostname is the whole demo: with one API container it never
// changes; with 3 replicas behind a Kubernetes Service it hops between pods.
async function load() {
  const res = await fetch('/api/tasks');
  const data = await res.json();
  served.textContent = data.served_by;
  list.innerHTML = '';
  for (const t of data.tasks) {
    const li = document.createElement('li');
    li.className = t.done ? 'done' : '';
    const span = document.createElement('span');
    span.className = 'title';
    span.textContent = t.title;
    span.onclick = async () => { await fetch(`/api/tasks/${t.id}/toggle`, {method: 'PUT'}); load(); };
    const del = document.createElement('button');
    del.textContent = '✕';
    del.onclick = async () => { await fetch(`/api/tasks/${t.id}`, {method: 'DELETE'}); load(); };
    li.append(span, del);
    list.append(li);
  }
}

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const title = document.getElementById('title').value.trim();
  if (!title) return;
  await fetch('/api/tasks', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({title})});
  document.getElementById('title').value = '';
  load();
};

load();
setInterval(load, 4000);
</script>
</body>
</html>
