# Gateway config. The upstream host is just "api" — in Exercise 1 that name
# is resolved by Docker's network DNS (container named api); in Exercise 2 it
# is resolved by Kubernetes cluster DNS (Service named api). Same config,
# both worlds — that parity is the point.
server {
    listen 80;

    # Static UI
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # API routes: /api/tasks -> http://api:8000/tasks
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
    }
}
