# The database tier: Secret, PVC, seed ConfigMap, Deployment, Service.
# Same objects as k8s/01-04, templated. No namespace fields — Helm installs
# into the release namespace (-n flag), which is what makes one chart serve
# many environments.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.credentials.database | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-seed
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS tasks (
        id SERIAL PRIMARY KEY,
        title TEXT NOT NULL,
        done BOOLEAN NOT NULL DEFAULT FALSE
    );
    INSERT INTO tasks (title, done) VALUES
        ('Finish Exercise 1 — containers by hand', true),
        ('Finish Exercise 2 — the Kubernetes way', true),
        ('Finish Exercise 3 — troubleshooting', true),
        ('Deploy with Helm', true);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: seed
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.credentials.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: seed
          configMap:
            name: postgres-seed
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
