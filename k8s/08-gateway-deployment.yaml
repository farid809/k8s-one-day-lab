# The gateway pod — our Exercise 1 image, with its nginx.conf overridden by
# the ConfigMap mount (subPath mounts one file, not a whole directory).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: taskboard-gateway:v1
          imagePullPolicy: Never       # loaded via `minikube image load`
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: gateway-config
