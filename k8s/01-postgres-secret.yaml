# In Exercise 1 the DB password sat in plain sight inside your shell history.
# A Secret gives it one named home; the deployments reference it, never the value.
# (stringData = write plain text here, the API stores it base64-encoded.
# Real clusters add encryption-at-rest / external secret stores on top.)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: taskboard
type: Opaque
stringData:
  POSTGRES_USER: taskboard
  POSTGRES_PASSWORD: lab-only-password
  POSTGRES_DB: taskboard
